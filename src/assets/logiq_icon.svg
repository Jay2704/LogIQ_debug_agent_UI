<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- L: vertical bar then foot -->
  <path d="M12 7L12 40L30 40" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Q ring: center(38,28) r=16, 70° gap at lower-left; rotate(170) puts gap at 135° -->
  <circle cx="38" cy="28" r="16" stroke="url(#g)" stroke-width="7" stroke-linecap="round" fill="none"
    stroke-dasharray="81 19.5" transform="rotate(170 38 28)"/>
  <!-- Centre dot -->
  <circle cx="38" cy="28" r="3.5" fill="url(#g)"/>
</svg>
